<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#07090c">
  <title>Harrison's Market Board</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090c;
      --panel: #0b0f14;
      --line: #263142;
      --text: #f4f7fb;
      --muted: #9eabba;
      --green: #4df08a;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    html { overflow-y: auto; }
    body { min-height: calc(100% + 96px); }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Arial Narrow", "Roboto Condensed", Arial, Helvetica, sans-serif;
    }
    .board {
      position: sticky;
      top: 0;
      display: grid;
      grid-template-rows: 46px minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      min-height: 320px;
      background:
        radial-gradient(circle at 18% 0%, rgba(77,240,138,.08), transparent 30%),
        var(--bg);
    }
    header {
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(7,9,12,.96);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .13em;
    }
    .brand, .status { display: flex; align-items: center; gap: 8px; }
    .brand { color: #edf5ff; font-size: 13px; }
    .status strong { color: var(--green); }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(77,240,138,.8);
      animation: pulse 2.2s ease-in-out infinite;
    }
    .divider { width: 1px; height: 12px; background: #334054; }
    .ticker, .heatmap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    .ticker { border-bottom: 1px solid var(--line); background: var(--panel); }
    .heatmap { padding: 0; }
    .tradingview-widget-container,
    .tradingview-widget-container__widget,
    iframe { width: 100% !important; height: 100% !important; }
    .heatmap iframe { height: calc(100% + 32px) !important; }
    .scroll-buffer { height: 96px; pointer-events: none; }
    .keep-awake {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 20;
      padding: 7px 10px;
      border: 1px solid rgba(77,240,138,.65);
      border-radius: 999px;
      background: rgba(7,9,12,.92);
      color: var(--green);
      font: 700 11px/1 Arial, sans-serif;
      letter-spacing: .08em;
      box-shadow: 0 3px 16px rgba(0,0,0,.35);
      transition: opacity .4s ease;
    }
    .keep-awake.is-active { opacity: 0; pointer-events: none; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @media (max-height: 400px) {
      .board { grid-template-rows: 42px minmax(0, 1fr); }
      header { padding: 0 10px; font-size: 11px; }
    }
    @media (max-width: 520px) { .desktop-status { display: none; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main class="board">
    <section class="ticker" aria-label="Live ticker tape">
      <div id="ticker-widget" class="tradingview-widget-container"></div>
    </section>

    <section class="heatmap" aria-label="S&P 500 stock heatmap">
      <div id="heatmap-widget" class="tradingview-widget-container"></div>
    </section>
  </main>
  <script>
    (() => {
      const tickerConfig = {
        symbols: [
          { proName: "FOREXCOM:SPXUSD", title: "S&P 500" },
          { proName: "NASDAQ:NDX", title: "NASDAQ 100" },
          { proName: "AMEX:SPY", title: "SPY" },
          { proName: "NASDAQ:QQQ", title: "QQQ" },
          { proName: "NASDAQ:PLTR", title: "PLTR" },
          { proName: "NASDAQ:NVDA", title: "NVDA" },
          { proName: "NASDAQ:AAPL", title: "AAPL" },
          { proName: "NASDAQ:AMZN", title: "AMZN" },
          { proName: "NASDAQ:GOOGL", title: "GOOGL" },
          { proName: "NASDAQ:META", title: "META" },
          { proName: "COINBASE:BTCUSD", title: "BITCOIN" }
        ],
        showSymbolLogo: false,
        isTransparent: true,
        displayMode: "adaptive",
        colorTheme: "dark",
        locale: "en"
      };

      const heatmapConfig = {
        exchanges: [],
        dataSource: "SPX500",
        grouping: "sector",
        blockSize: "market_cap_basic",
        blockColor: "change",
        locale: "en",
        symbolUrl: "",
        colorTheme: "dark",
        hasTopBar: false,
        isDataSetEnabled: false,
        isZoomEnabled: true,
        hasSymbolTooltip: true,
        isMonoSize: false,
        width: "100%",
        height: "100%"
      };

      function mountWidget(id, source, config) {
        const host = document.getElementById(id);
        host.textContent = "";

        const widget = document.createElement("div");
        widget.className = "tradingview-widget-container__widget";
        host.appendChild(widget);

        const script = document.createElement("script");
        script.src = source + "?fresh=" + Date.now();
        script.async = true;
        script.textContent = JSON.stringify(config);
        host.appendChild(script);
      }

      function refreshMarketWidgets() {
        mountWidget(
          "ticker-widget",
          "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js",
          tickerConfig
        );
        mountWidget(
          "heatmap-widget",
          "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js",
          heatmapConfig
        );
      }

      refreshMarketWidgets();
      setInterval(refreshMarketWidgets, 5 * 60 * 1000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshMarketWidgets();
      });
    })();
  </script>
  <button id="keep-awake" class="keep-awake" type="button">KEEP SCREEN ON</button>
  <div class="scroll-buffer" aria-hidden="true"></div>
  <script>
    (() => {
      const button = document.getElementById("keep-awake");
      let silentAudio;
      let wakeLock;

      function writeAscii(view, offset, text) {
        for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
      }

      function makeSilentWav() {
        const sampleRate = 8000;
        const sampleCount = sampleRate;
        const buffer = new ArrayBuffer(44 + sampleCount);
        const view = new DataView(buffer);
        writeAscii(view, 0, "RIFF");
        view.setUint32(4, 36 + sampleCount, true);
        writeAscii(view, 8, "WAVE");
        writeAscii(view, 12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate, true);
        view.setUint16(32, 1, true);
        view.setUint16(34, 8, true);
        writeAscii(view, 36, "data");
        view.setUint32(40, sampleCount, true);
        for (let i = 44; i < buffer.byteLength; i++) view.setUint8(i, 128);
        return URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
      }

      async function activate() {
        try {
          if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
        } catch (_) {}

        try {
          silentAudio = document.createElement("audio");
          silentAudio.src = makeSilentWav();
          silentAudio.loop = true;
          silentAudio.preload = "auto";
          silentAudio.setAttribute("playsinline", "");
          document.body.appendChild(silentAudio);
          await silentAudio.play();
          button.textContent = "DISPLAY LOCKED";
          setTimeout(() => button.classList.add("is-active"), 900);
        } catch (_) {
          button.textContent = "TAP AGAIN";
        }
      }

      button.addEventListener("click", activate, { once: true });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && silentAudio) silentAudio.play().catch(() => {});
      });
    })();
  </script>
</body>
</html>
