<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#07090c">
  <title>Harrison's Market Board</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090c;
      --panel: #0b0f14;
      --line: #263142;
      --text: #f4f7fb;
      --muted: #9eabba;
      --green: #4df08a;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Arial Narrow", "Roboto Condensed", Arial, Helvetica, sans-serif;
    }
    .board {
      display: grid;
      grid-template-rows: 34px 60px minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      min-height: 320px;
      background:
        radial-gradient(circle at 18% 0%, rgba(77,240,138,.08), transparent 30%),
        var(--bg);
    }
    header {
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(7,9,12,.96);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .13em;
    }
    .brand, .status { display: flex; align-items: center; gap: 8px; }
    .brand { color: #edf5ff; font-size: 13px; }
    .status strong { color: var(--green); }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(77,240,138,.8);
      animation: pulse 2.2s ease-in-out infinite;
    }
    .divider { width: 1px; height: 12px; background: #334054; }
    .ticker, .heatmap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    .ticker { border-bottom: 1px solid var(--line); background: var(--panel); }
    .heatmap { padding: 4px 6px 6px; }
    .tradingview-widget-container,
    .tradingview-widget-container__widget,
    iframe { width: 100% !important; height: 100% !important; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @media (max-height: 400px) {
      .board { grid-template-rows: 28px 52px minmax(0, 1fr); }
      header { padding: 0 10px; font-size: 11px; }
    }
    @media (max-width: 520px) { .desktop-status { display: none; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main class="board">
    <header>
      <div class="brand"><span class="dot"></span><span>MARKET</span></div>
      <div class="status"><strong>LIVE</strong><span class="divider desktop-status"></span><span class="desktop-status">US EQUITIES</span></div>
    </header>

    <section class="ticker" aria-label="Live ticker tape">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
        {
          "symbols": [
            {"proName":"FOREXCOM:SPXUSD","title":"S&P 500"},
            {"proName":"NASDAQ:NDX","title":"NASDAQ 100"},
            {"proName":"AMEX:SPY","title":"SPY"},
            {"proName":"NASDAQ:QQQ","title":"QQQ"},
            {"proName":"NASDAQ:PLTR","title":"PLTR"},
            {"proName":"NASDAQ:NVDA","title":"NVDA"},
            {"proName":"NASDAQ:AAPL","title":"AAPL"},
            {"proName":"NASDAQ:AMZN","title":"AMZN"},
            {"proName":"NASDAQ:GOOGL","title":"GOOGL"},
            {"proName":"NASDAQ:META","title":"META"},
            {"proName":"COINBASE:BTCUSD","title":"BITCOIN"}
          ],
          "showSymbolLogo": false,
          "isTransparent": true,
          "displayMode": "adaptive",
          "colorTheme": "dark",
          "locale": "en"
        }
        </script>
      </div>
    </section>

    <section class="heatmap" aria-label="S&P 500 stock heatmap">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
        {
          "exchanges": [],
          "dataSource": "SPX500",
          "grouping": "sector",
          "blockSize": "market_cap_basic",
          "blockColor": "change",
          "locale": "en",
          "symbolUrl": "",
          "colorTheme": "dark",
          "hasTopBar": false,
          "isDataSetEnabled": false,
          "isZoomEnabled": true,
          "hasSymbolTooltip": true,
          "isMonoSize": false,
          "width": "100%",
          "height": "100%"
        }
        </script>
      </div>
    </section>
  </main>
</body>
</html>
